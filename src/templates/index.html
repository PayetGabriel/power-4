<!--
  POWER 4 (CONNECT FOUR) GAME - HTML STRUCTURE
  
  This is the main HTML file for a Connect Four game.
  It follows the KISS principle (Keep It Simple, Stupid) with minimal markup.
  
  Structure:
  - Title and current player indicator
  - Empty grid container (populated by JavaScript)
  - Links to CSS and JavaScript files
-->

<!DOCTYPE html>
<html lang="fr"> <!-- French language for "Puissance 4" (Connect Four in French) -->
<head>
  <!-- Basic meta information -->
  <meta charset="UTF-8"> <!-- Character encoding for proper text display -->
  <title>Puissance 4</title> <!-- Browser tab title -->
  
  <!-- Link to external CSS file for styling -->
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div>
    <header>
      <!-- Main game title -->
      <h1>Puissance 4</h1>
      
      <!-- Current player indicator -->
      <!-- The span element will be updated by JavaScript to show whose turn it is -->
      <div class = "controls"></div>
        <p id="current-player">Tour: <span class="red">Rouge</span></p>
        <button id="reset-btn" onclick="resetGame()">Nouvelle Partie</button>
        <button id="them-toggle">🌞 / 🌙</button>
      </div>
    </header>

    <main>
      <div id="grid"></div>
    </main>
  </div>
  
  <script src="/static/script.js"></script>

  <script>
    const toggleBtn = document.getElementById('them-toggle');
    const userPref = localStorage.getItem('theme');

    if (userPref === 'dark') {
      document.body.classList.add('dark');
    }
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const mode = document.body.classList.contains('dark') ? 'dark' : 'light';
      localStorage.setItem('theme', mode);
    });
  </script>
</body>
</html>
