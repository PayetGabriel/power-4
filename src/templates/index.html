<!DOCTYPE html>
<html>
<head>
  <title>Puissance 4</title>
  <style>
    table { border-collapse: collapse; }
    td { width: 50px; height: 50px; border: 1px solid black; text-align: center; }
    .empty { background-color: white; }
    .p1 { background-color: red; }
    .p2 { background-color: yellow; }
  </style>
</head>
<body>
  <h1>Puissance 4</h1>
  <table>
    {{range .Board}}
      <tr>
        {{range .}}
          <td class="{{.}}"></td>
        {{end}}
      </tr>
    {{end}}
  </table>
</body>
</html>
