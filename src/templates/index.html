<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Puissance 4</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
    }

    h1 {
      font-weight: bold;
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    /* Grille Puissance 4 */
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 60px);
      grid-template-rows: repeat(6, 60px);
      gap: 5px;
      justify-content: center; /* centre la grille */
      margin: 0 auto;
      background-color: #0066cc; /* bleu plateau */
      padding: 10px;
      border-radius: 10px;
    }

    .cell {
      width: 60px;
      height: 60px;
      border-radius: 50%; /* trous ronds */
      background-color: white;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <h1>Puissance 4</h1>

  <div class="grid">
    <!-- 6 lignes × 7 colonnes -->
    <!-- Ligne 1 -->
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <!-- Ligne 2 -->
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <!-- Ligne 3 -->
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <!-- Ligne 4 -->
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <!-- Ligne 5 -->
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <!-- Ligne 6 -->
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  </div>
</body>
</html>
