<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Victoire !</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #1e90ff, #00bfff);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px #000;
    }
    .winner {
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      background-color: #fff;
      color: #1e90ff;
      transition: 0.3s;
    }
    button:hover {
      background-color: #1e90ff;
      color: white;
    }
  </style>
</head>
<body>
  <h1>🏆 Victoire !</h1>
  <p class="winner">{{.Winner}} a gagné la partie 🎉</p>
  <div>
    <button onclick="window.location.href='/replay'">Rejouer</button>
    <button onclick="window.location.href='/menu'">Retour au menu</button>
  </div>
</body>
</html>
