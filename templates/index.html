<!--
  POWER 4 (CONNECT FOUR) GAME - HTML STRUCTURE
  Main HTML for a Connect Four game.
  Combines functional JS structure (reset, theme toggle) and detailed comments.
-->

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Puissance 4</title>
  
  <!-- Link to external CSS file for styling -->
  <link rel="stylesheet" href="/static/styles.css">
</head>
<script>
  // Attendre que le DOM soit prêt puis mettre à jour le titre
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'normal';
    const titleEl = document.querySelector('h1');

    // Si on ne trouve pas de <h1>, on sort proprement
    if (!titleEl) return;

    const puissances = {
      easy: 3,
      medium: 5,
      normal: 4,
      hard: 7
    };

    const nombre = puissances[mode] || 4;
    titleEl.textContent = `Puissance ${nombre}`;
  });
</script>
<body>
  <header>
    <!-- Main game title -->
    <h1>Puissance 4</h1>
    
    <!-- Current player indicator and controls -->
    <!-- The .controls div is left empty for JS alignment, buttons are outside to keep JS functional -->
    <div class="controls"></div>
    
    <!-- Display whose turn it is -->
    <p id="current-player">
      Tour: <span class="red">Rouge</span>
    </p>
    
    <!-- Game buttons -->
    <div class="controls">
      <button id="reset-btn" onclick="resetGame()">Nouvelle Partie</button>
      <button id="them-toggle">☀️​ / 🌙</button>
    </div>
  </header>

  <main>
    <!-- Game grid container: populated with 42 cells via JS -->
    <div id="grid"></div>
  </main>

  <!-- Game logic -->
  <script src="/static/script.js"></script>

  <!-- Theme toggle logic -->
  <script>
    const toggleBtn = document.getElementById('them-toggle');
    const userPref = localStorage.getItem('theme');

    if (userPref === 'dark') {
      document.body.classList.add('dark');
    }
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const mode = document.body.classList.contains('dark') ? 'dark' : 'light';
      localStorage.setItem('theme', mode);
    });
  </script>
  <!-- Modal overlay victoire/égalité -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Victoire !</h2>
      <p id="modal-message">Le joueur Rouge a gagné</p>
      <div class="modal-buttons">
        <button id="modal-close">Fermer</button>
        <button id="modal-replay">Rejouer</button>
        <button id="modal-menu">Retour au menu</button>
      </div>
    </div>
  </div>
</body>
</html>
