<!--
  POWER 4 (CONNECT FOUR) GAME - HTML STRUCTURE
  Main HTML for a Connect Four game.
  Combines functional JS structure (reset, theme toggle) and detailed comments.
-->

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu du Jeu</title>
  
  <!-- Link to external CSS file for styling -->
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/styleMenu.css">
</head>
<body>
  <header>
    <!-- Main game title -->
    <h1>Page de compte</h1>
  </header>

  <main>
    <!-- Form to register a new account -->
    <form action="/register" method="GET">
      <button type="submit">S'inscrire</button>
    </form>

    <!-- Form to login to an existing account -->
    <form action="/login" method="GET">
      <button type="submit">Se connecter</button>
    </form>

    <!-- Fields and button that will only display after registration or login -->
    <div id="form-section" style="display: none;">
      <!-- Form to redirect to the game -->
      <form action="/game" method="GET">
        <label for="username">Nom d'utilisateur :</label>
        <input type="text" id="username" name="username" placeholder="Entrez votre nom" required>

        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>

        <button type="submit">Confirmer</button>
      </form>
    </div>
  </main>

  <script>
    // Example logic to display fields after registration or login
    document.querySelectorAll('form[action="/register"], form[action="/login"]').forEach(form => {
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('form-section').style.display = 'block';
        });
    });
  </script>
</body>
</html>
